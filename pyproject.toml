[project]
name = "alexnet_cifar10"
version = "0.1.0"
description = "AlexNet re-implementation on CIFAR-10"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]


[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
